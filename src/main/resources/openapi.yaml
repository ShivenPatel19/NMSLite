openapi: 3.0.3
info:
  title: NMSLite API
  description: |
    Network Management System Lite - A comprehensive NMS solution for device discovery, monitoring, and management.

    ## Authentication
    All endpoints (except `/api/auth/login`) require JWT authentication.
    Use the login endpoint to obtain a JWT token, then include it in the `Authorization` header as `Bearer <token>`.

    ## Features
    - User Management & Authentication
    - Credential Profile Management
    - Device Discovery & Provisioning
    - Device Monitoring & Metrics
    - Availability Tracking
  version: 2.0.0

servers:
  - url: https://localhost:8443
    description: Local development server (HTTPS only)

tags:
  - name: Authentication
    description: User authentication and session management
  - name: Users
    description: User management operations
  - name: Credentials
    description: Credential profile management
  - name: Discovery Profiles
    description: Discovery profile management
  - name: Discovery Operations
    description: Device discovery operations
  - name: Devices
    description: Device management and monitoring
  - name: Metrics
    description: Device metrics and performance data
  - name: Availability
    description: Device availability tracking

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /api/auth/login endpoint

paths:
  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate user and receive JWT token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  description: Username for authentication
                  example: "motadataadmin"
                password:
                  type: string
                  description: Password for authentication
                  example: "motadataadmin"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated:
                    type: boolean
                    description: Whether authentication was successful
                    example: true
                  user_id:
                    type: string
                    format: uuid
                    description: User ID
                    example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  username:
                    type: string
                    description: Username
                    example: "motadataadmin"
                  is_active:
                    type: boolean
                    description: Whether the user account is active
                    example: true
                  jwt_token:
                    type: string
                    description: JWT token for authentication
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  token_type:
                    type: string
                    description: Token type (always "Bearer")
                    example: "Bearer"
                  expires_in_hours:
                    type: integer
                    description: Token expiry time in hours
                    example: 24
                  message:
                    type: string
                    description: Authentication result message
                    example: "Authentication successful - JWT token generated"
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Invalid username or password"

  /api/users:
    get:
      tags:
        - Users
      summary: Get all users
      description: Retrieve list of all users with optional filter for inactive users
      parameters:
        - name: includeInactive
          in: query
          description: Include inactive users in the response
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    user_id:
                      type: string
                      format: uuid
                    username:
                      type: string
                    is_active:
                      type: boolean
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

    post:
      tags:
        - Users
      summary: Create new user
      description: Create a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  description: Username (3-50 characters, alphanumeric and underscore only)
                  minLength: 3
                  maxLength: 50
                  pattern: '^[a-zA-Z0-9_]+$'
                  example: "john_doe"
                password:
                  type: string
                  description: Password (minimum 8 characters)
                  minLength: 8
                  example: "SecurePass123"
                is_active:
                  type: boolean
                  description: Whether the user account is active
                  default: true
                  example: true
      responses:
        '200':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user_id:
                    type: string
                    format: uuid
                  username:
                    type: string
                  is_active:
                    type: boolean
                  message:
                    type: string
                    example: "User created successfully"
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/users/{id}:
    put:
      tags:
        - Users
      summary: Update user
      description: Update an existing user's information
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: At least one field must be provided
              properties:
                username:
                  type: string
                  description: Username (3-50 characters, alphanumeric and underscore only)
                  minLength: 3
                  maxLength: 50
                  pattern: '^[a-zA-Z0-9_]+$'
                  example: "john_doe_updated"
                password:
                  type: string
                  description: Password (minimum 8 characters)
                  minLength: 8
                  example: "NewSecurePass123"
                is_active:
                  type: boolean
                  description: Whether the user account is active
                  example: false
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user_id:
                    type: string
                    format: uuid
                  username:
                    type: string
                  is_active:
                    type: boolean
                  message:
                    type: string
                    example: "User updated successfully"
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

    delete:
      tags:
        - Users
      summary: Delete user
      description: Delete a user account
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user_id:
                    type: string
                    format: uuid
                  username:
                    type: string
                  message:
                    type: string
                    example: "User deleted successfully"
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/credentials:
    get:
      tags:
        - Credentials
      summary: Get all credential profiles
      description: Retrieve list of all credential profiles
      responses:
        '200':
          description: Credentials retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  credentials:
                    type: array
                    items:

    post:
      tags:
        - Credentials
      summary: Create credential profile
      description: Create a new credential profile for device authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - profile_name
                - username
                - password
                - port
                - protocol
              properties:
                profile_name:
                  type: string
                  description: Unique name for the credential profile
                  maxLength: 100
                  example: "SSH Admin Credentials"
                username:
                  type: string
                  description: Username for device authentication
                  maxLength: 100
                  example: "admin"
                password:
                  type: string
                  description: Password for device authentication
                  maxLength: 500
                  example: "SecurePassword123"
                port:
                  type: integer
                  description: Port number (1-65535)
                  minimum: 1
                  maximum: 65535
                  example: 22
                protocol:
                  type: string
                  description: Protocol to use (e.g., ssh, winrm)
                  maxLength: 50
                  example: "ssh"
      responses:
        '200':
          description: Credential created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  credential_profile_id:
                    type: string
                    format: uuid
                    example: "04ecd98c-ded2-44db-b269-00d4e88bf956"
                  profile_name:
                    type: string
                    example: "SSH Admin Credentials"
                  username:
                    type: string
                    example: "admin"
                  port:
                    type: integer
                    example: 22
                  protocol:
                    type: string
                    example: "ssh"
                  created_at:
                    type: string
                    format: date-time
                  message:
                    type: string
                    example: "Credential profile created successfully"
        '400':
          description: Invalid input or duplicate profile name
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "Profile name already exists"

  /api/credentials/{id}:
    put:
      tags:
        - Credentials
      summary: Update credential profile
      description: Update an existing credential profile
      parameters:
        - name: id
          in: path
          required: true
          description: Credential ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: At least one field must be provided
              properties:
                profile_name:
                  type: string
                  description: Unique name for the credential profile
                  maxLength: 100
                  example: "SSH Admin Credentials Updated"
                username:
                  type: string
                  description: Username for device authentication
                  maxLength: 100
                  example: "admin"
                password:
                  type: string
                  description: Password for device authentication
                  maxLength: 500
                  example: "NewSecurePassword123"
                port:
                  type: integer
                  description: Port number (1-65535)
                  minimum: 1
                  maximum: 65535
                  example: 2222
                protocol:
                  type: string
                  description: Protocol to use (e.g., ssh, winrm)
                  maxLength: 50
                  example: "ssh"
      responses:
        '200':
          description: Credential updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Credential profile updated successfully"
        '404':
          description: Credential not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "Credential profile not found"

    delete:
      tags:
        - Credentials
      summary: Delete credential profile
      description: Delete a credential profile (only if not in use by devices or discovery profiles)
      parameters:
        - name: id
          in: path
          required: true
          description: Credential ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Credential deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  credential_profile_id:
                    type: string
                    format: uuid
                  message:
                    type: string
                    example: "Credential profile deleted successfully"
        '400':
          description: Credential in use
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Cannot delete credential profile - it is currently in use by devices or discovery profiles"
        '404':
          description: Credential not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string


  /api/discovery-profiles:
    get:
      tags:
        - Discovery Profiles
      summary: Get all discovery profiles
      description: Retrieve list of all discovery profiles with device type and credential information
      responses:
        '200':
          description: Discovery profiles retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  discovery_profiles:
                    type: array
                    items:
                      type: object
                      properties:
                        profile_id:
                          type: string
                          format: uuid
                        discovery_name:
                          type: string
                        ip_address:
                          type: string
                        is_range:
                          type: boolean
                        credential_profile_ids:
                          type: array
                          items:
                            type: string
                            format: uuid
                        credential_count:
                          type: integer
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                        device_type_name:
                          type: string
                        default_port:
                          type: integer

    post:
      tags:
        - Discovery Profiles
      summary: Create discovery profile
      description: Create a new discovery profile for device discovery. Port and protocol are now stored in credential profiles.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - discovery_name
                - ip_address
                - device_type_id
                - credential_profile_ids
              properties:
                discovery_name:
                  type: string
                  description: Unique name for the discovery profile
                  maxLength: 100
                  example: "Office Network Discovery"
                ip_address:
                  type: string
                  description: Single IP address (e.g., "192.168.1.100") or IP range (e.g., "192.168.1.1-50")
                  example: "192.168.1.100"
                is_range:
                  type: boolean
                  description: Whether ip_address is a range (true) or single IP (false)
                  default: false
                  example: false
                device_type_id:
                  type: string
                  format: uuid
                  description: UUID of the device type
                  example: "5b882cc2-8d95-497f-a2f8-8fb9917d16bf"
                credential_profile_ids:
                  type: array
                  description: Array of credential profile UUIDs (1-10 credentials for brute-force testing)
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                    format: uuid
                  example: ["04ecd98c-ded2-44db-b269-00d4e88bf956", "23521ed8-cfe2-458a-9a57-b4c17e3ff091"]
      responses:
        '200':
          description: Discovery profile created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  profile_id:
                    type: string
                    format: uuid
                    example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  discovery_name:
                    type: string
                    example: "Office Network Discovery"
                  ip_address:
                    type: string
                    example: "192.168.1.100"
                  is_range:
                    type: boolean
                    example: false
                  created_at:
                    type: string
                    format: date-time
                  message:
                    type: string
                    example: "Discovery profile created successfully"
        '400':
          description: Invalid input or duplicate discovery name
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "Discovery name already exists"

  /api/discovery-profiles/{id}:
    delete:
      tags:
        - Discovery Profiles
      summary: Delete discovery profile
      description: Delete a discovery profile (hard delete)
      parameters:
        - name: id
          in: path
          required: true
          description: Discovery Profile ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Discovery profile deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  profile_id:
                    type: string
                    format: uuid
                  message:
                    type: string
                    example: "Discovery profile deleted successfully"
        '404':
          description: Discovery profile not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/discovery/test:
    post:
      tags:
        - Discovery Operations
      summary: Test discovery from profile
      description: Execute device discovery using a saved discovery profile. The profile contains all necessary configuration (IP targets, credentials, device type, ports, timeouts).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - profile_id
              properties:
                profile_id:
                  type: string
                  format: uuid
                  description: UUID of the discovery profile to execute
                  example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      responses:
        '200':
          description: Discovery test completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  profile_id:
                    type: string
                    format: uuid
                    description: Discovery profile ID
                  discovery_name:
                    type: string
                    description: Name of the discovery profile
                  total_targets:
                    type: integer
                    description: Total number of IP targets tested
                    example: 10
                  devices_discovered:
                    type: integer
                    description: Number of new devices discovered and created
                    example: 7
                  devices_failed:
                    type: integer
                    description: Number of devices that failed discovery
                    example: 2
                  devices_existing:
                    type: integer
                    description: Number of devices that already exist in database
                    example: 1
                  discovered_devices:
                    type: array
                    description: Array of newly discovered devices
                    items:
                      type: object
                      properties:
                        device_id:
                          type: string
                          format: uuid
                        ip_address:
                          type: string
                        hostname:
                          type: string
                        device_type:
                          type: string
                  failed_devices:
                    type: array
                    description: Array of devices that failed discovery
                    items:
                      type: object
                      properties:
                        ip_address:
                          type: string
                        error:
                          type: string
                  existing_devices:
                    type: array
                    description: Array of devices that already exist
                    items:
                      type: object
                      properties:
                        device_id:
                          type: string
                          format: uuid
                        ip_address:
                          type: string
                  message:
                    type: string
                    description: Summary message
                    example: "Test discovery completed: 7 discovered, 2 failed, 1 existing"
        '400':
          description: Invalid request (missing profile_id)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "Missing required field: profile_id"
        '500':
          description: Discovery execution failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "Failed to execute test discovery"

  /api/devices/discovered:
    get:
      tags:
        - Devices
      summary: Get discovered devices
      description: Get all devices that are discovered but not yet provisioned (is_provisioned = false)
      responses:
        '200':
          description: Discovered devices retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    device_id:
                      type: string
                      format: uuid
                    device_name:
                      type: string
                    ip_address:
                      type: string
                    device_type:
                      type: string
                    port:
                      type: integer
                    protocol:
                      type: string
                    credential_profile_id:
                      type: string
                      format: uuid
                    username:
                      type: string
                    password_encrypted:
                      type: string
                    credential_profile_name:
                      type: string
                    polling_interval_seconds:
                      type: integer
                    timeout_seconds:
                      type: integer
                    host_name:
                      type: string
                    is_provisioned:
                      type: boolean
                      example: false
                    is_deleted:
                      type: boolean
                      example: false
                    deleted_at:
                      type: string
                      format: date-time
                      nullable: true
                    created_at:
                      type: string
                      format: date-time
                    updated_at:
                      type: string
                      format: date-time
                      nullable: true

  /api/devices/provisioned:
    get:
      tags:
        - Devices
      summary: Get provisioned devices
      description: Get all devices that are provisioned (is_provisioned = true)
      responses:
        '200':
          description: Provisioned devices retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    device_id:
                      type: string
                      format: uuid
                    device_name:
                      type: string
                    ip_address:
                      type: string
                    device_type:
                      type: string
                    port:
                      type: integer
                    protocol:
                      type: string
                    credential_profile_id:
                      type: string
                      format: uuid
                    username:
                      type: string
                    password_encrypted:
                      type: string
                    credential_profile_name:
                      type: string
                    polling_interval_seconds:
                      type: integer
                    timeout_seconds:
                      type: integer
                    host_name:
                      type: string
                    is_provisioned:
                      type: boolean
                      example: true
                    is_deleted:
                      type: boolean
                      example: false
                    deleted_at:
                      type: string
                      format: date-time
                      nullable: true
                    created_at:
                      type: string
                      format: date-time
                    updated_at:
                      type: string
                      format: date-time
                      nullable: true

  /api/devices/{id}/provisioning/enable:
    post:
      tags:
        - Devices
      summary: Enable device provisioning
      description: Enable provisioning for a specific device (sets is_provisioned = true)
      parameters:
        - name: id
          in: path
          required: true
          description: Device ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Provisioning enabled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Device provisioning enabled successfully"
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string

  /api/devices/{id}/provisioning/disable:
    post:
      tags:
        - Devices
      summary: Disable device provisioning
      description: Disable provisioning for a specific device (sets is_provisioned = false)
      parameters:
        - name: id
          in: path
          required: true
          description: Device ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Provisioning disabled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Device provisioning disabled successfully"
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string

  /api/devices/{id}/config:
    put:
      tags:
        - Devices
      summary: Update device configuration
      description: Update device name, polling interval, and timeout. Port and protocol are now stored in credential profiles.
      parameters:
        - name: id
          in: path
          required: true
          description: Device ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: At least one field must be provided
              properties:
                device_name:
                  type: string
                  description: Name of the device
                  maxLength: 100
                  example: "Core Router 1"
                polling_interval_seconds:
                  type: integer
                  description: Polling interval in seconds (60-86400)
                  minimum: 60
                  maximum: 86400
                  example: 300
                timeout_seconds:
                  type: integer
                  description: Timeout in seconds (1-600)
                  minimum: 1
                  maximum: 600
                  example: 30
      responses:
        '200':
          description: Device configuration updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  device_id:
                    type: string
                    format: uuid
                  device_name:
                    type: string
                  polling_interval_seconds:
                    type: integer
                  timeout_seconds:
                    type: integer
                  is_provisioned:
                    type: boolean
                  message:
                    type: string
                    example: "Device configuration updated successfully"
